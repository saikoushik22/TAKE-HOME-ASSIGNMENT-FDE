[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async tests need no per-test decorator.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    --strict-markers
    --tb=short
    -ra

markers =
    integration: requires a live PostgreSQL (skipped automatically when absent)
    slow: exercises a real model and is slow on CPU

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
