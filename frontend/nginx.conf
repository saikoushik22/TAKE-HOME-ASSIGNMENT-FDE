server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never sniff a declared content type. Cheap defence against a response
    # being reinterpreted as something executable.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients pinned to a
    # stale bundle that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Server-Sent Events ---
        # Without these, nginx buffers the whole event stream and the "streaming"
        # UI arrives in one lump at the end, which defeats the entire point of
        # narrating a slow local generation.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # A CPU-only local model can legitimately take minutes on a long essay.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback: any unmatched path renders the app, which routes client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
