<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Grounded product and growth answers from Lenny's Podcast transcripts."
    />
    <!-- Applied before first paint so a dark-mode user never sees a white flash. -->
    <script>
      try {
        var stored = localStorage.getItem('lga-theme')
        var theme =
          stored ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
    <title>The Lenny Growth Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
